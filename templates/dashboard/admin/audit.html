{% extends "dashboard/admin/base_admin.html" %}
{% block admin_content %}
<div class="adm-card">
  <div class="adm-card-head">
    <form
      method="get"
      class="adm-audit-filter-form"
      hx-get="{% url 'dashboard:gestor_auditoria' %}"
      hx-trigger="keyup changed delay:300ms from:input[name='q'], change from:select[name='per_page'], submit"
      hx-target="#audit-table"
      hx-swap="outerHTML"
      hx-push-url="true"
    >
      <div class="adm-search adm-audit-search">
        <i class="bi bi-search"></i>
        <input type="text" name="q" value="{{ q }}" placeholder="Pesquisar por ação, utilizador, IP, dispositivo ou alteração..." autocomplete="off">
      </div>

      <label class="adm-audit-page-size">
        <span>Mostrar</span>
        <select name="per_page">
          {% for option in per_page_options %}
            <option value="{{ option }}" {% if option == per_page %}selected{% endif %}>{{ option }}</option>
          {% endfor %}
        </select>
      </label>

      <button class="adm-btn-ghost" type="submit"><i class="bi bi-funnel"></i> Filtrar</button>
    </form>

    <div style="display:flex;gap:.5rem;">
      <button class="adm-btn-ghost" type="button"><i class="bi bi-download"></i> Exportar</button>
    </div>
  </div>

  {% include "dashboard/admin/partials/audit_table.html" %}
</div>

<style>
.adm-audit-filter-form{
  display:flex;
  align-items:center;
  gap:.75rem;
  flex:1;
  min-width:0;
  flex-wrap:wrap;
}
.adm-audit-search{
  flex:1 1 28rem;
  min-width:18rem;
}
.adm-audit-page-size{
  display:flex;
  align-items:center;
  gap:.45rem;
  font-size:.78rem;
  font-weight:700;
  color:#64748b;
}
.adm-audit-page-size select{
  min-height:2.45rem;
  border:1px solid #dbe3ef;
  border-radius:.65rem;
  padding:0 .75rem;
  font-weight:800;
  color:#0f172a;
  background:#fff;
}
.adm-audit-row{
  cursor:pointer;
}
.adm-audit-row:hover{
  background:#f8fafc;
}
.adm-audit-row.is-open{
  background:#f8fafc;
}
.adm-audit-chevron{
  transition:transform .15s ease;
  color:#64748b;
}
.adm-audit-row.is-open .adm-audit-chevron{
  transform:rotate(90deg);
}
.adm-audit-action-pill{
  display:inline-flex;
  align-items:center;
  padding:.18rem .58rem;
  border-radius:999px;
  font-size:.74rem;
  font-weight:800;
  border:1px solid transparent;
  white-space:nowrap;
}
.adm-audit-action-pill--success{background:#dcfce7;color:#166534;border-color:#bbf7d0;}
.adm-audit-action-pill--info{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe;}
.adm-audit-action-pill--warning{background:#fef3c7;color:#92400e;border-color:#fde68a;}
.adm-audit-action-pill--danger{background:#fee2e2;color:#991b1b;border-color:#fecaca;}
.adm-audit-action-pill--neutral{background:#f1f5f9;color:#334155;border-color:#e2e8f0;}
.adm-table tbody tr.adm-audit-detail-row:hover td,
.adm-audit-detail-row > td{
  background:#f8fafc;
  border-top:0;
  text-align:left !important;
  padding:0 !important;
}
.adm-audit-detail{
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);
  gap:1rem;
  padding:1rem;
  align-items:start;
}
.adm-audit-technical{
  grid-column:1 / -1;
  justify-self:stretch;
}
.adm-audit-detail-main,
.adm-audit-detail-side{
  display:flex;
  flex-direction:column;
  gap:.85rem;
}
.adm-audit-detail-box{
  border:1px solid #e2e8f0;
  border-radius:.9rem;
  background:#fff;
  padding:1rem;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:.9rem;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
}
.adm-audit-event-card{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  gap:.85rem;
  padding:1rem;
  border:1px solid #e2e8f0;
  border-radius:.95rem;
  background:#fff;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
}
.adm-audit-event-card--success{border-color:#bbf7d0;background:linear-gradient(135deg,#f0fdf4,#fff);}
.adm-audit-event-card--info{border-color:#bfdbfe;background:linear-gradient(135deg,#eff6ff,#fff);}
.adm-audit-event-card--warning{border-color:#fde68a;background:linear-gradient(135deg,#fffbeb,#fff);}
.adm-audit-event-card--danger{border-color:#fecaca;background:linear-gradient(135deg,#fef2f2,#fff);}
.adm-audit-event-icon{
  width:42px;
  height:42px;
  border-radius:.85rem;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#f1f5f9;
  color:#334155;
  font-size:1.05rem;
}
.adm-audit-event-card--success .adm-audit-event-icon{background:#dcfce7;color:#15803d;}
.adm-audit-event-card--info .adm-audit-event-icon{background:#dbeafe;color:#1d4ed8;}
.adm-audit-event-card--warning .adm-audit-event-icon{background:#fef3c7;color:#b45309;}
.adm-audit-event-card--danger .adm-audit-event-icon{background:#fee2e2;color:#b91c1c;}
.adm-audit-event-kicker{
  color:#64748b;
  font-size:.72rem;
  font-weight:850;
  letter-spacing:.05em;
  text-transform:uppercase;
  margin-bottom:.2rem;
}
.adm-audit-event-body h4{
  margin:0;
  color:#0f172a;
  font-size:1rem;
  font-weight:850;
}
.adm-audit-event-body p{
  margin:.35rem 0 0;
  color:#475569;
  font-size:.86rem;
  line-height:1.45;
  overflow-wrap:anywhere;
}
.adm-audit-detail-title{
  margin:0;
  font-size:.76rem;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:#64748b;
  font-weight:800;
}
.adm-audit-detail-section{
  display:flex;
  flex-direction:column;
  gap:.55rem;
  min-width:0;
}
.adm-audit-section-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:.8rem;
  flex-wrap:wrap;
}
.adm-audit-section-head span{
  color:#64748b;
  font-size:.8rem;
  line-height:1.4;
}
.adm-audit-change-list{
  display:flex;
  flex-direction:column;
  gap:.45rem;
}
.adm-audit-change{
  display:grid;
  grid-template-columns:minmax(9rem,.55fr) minmax(0,1fr);
  gap:.75rem;
  align-items:start;
  padding:.55rem .65rem;
  border:1px solid #e2e8f0;
  border-radius:.65rem;
  background:#f8fafc;
  font-size:.82rem;
  color:#64748b;
  overflow-wrap:anywhere;
}
.adm-audit-change strong{
  color:#334155;
}
.adm-audit-change-values{
  display:flex;
  align-items:center;
  gap:.35rem;
  flex-wrap:wrap;
  min-width:0;
}
.adm-audit-change-value{
  display:inline-flex;
  max-width:100%;
  padding:.18rem .45rem;
  border-radius:.4rem;
  background:#fff;
  color:#334155;
  border:1px solid #e2e8f0;
  overflow-wrap:anywhere;
}
.adm-audit-empty-note{
  padding:.85rem;
  border:1px dashed #cbd5e1;
  border-radius:.75rem;
  background:#f8fafc;
  color:#64748b;
  font-size:.84rem;
  line-height:1.45;
}
.adm-audit-facts{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:.65rem;
}
.adm-audit-fact{
  min-width:0;
  padding:.7rem;
  border:1px solid #e2e8f0;
  border-radius:.75rem;
  background:#f8fafc;
}
.adm-audit-fact span,
.adm-audit-access-item span{
  display:block;
  color:#94a3b8;
  font-size:.7rem;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.04em;
  margin-bottom:.18rem;
}
.adm-audit-fact strong,
.adm-audit-access-item strong{
  display:block;
  color:#0f172a;
  font-size:.84rem;
  line-height:1.35;
  overflow-wrap:anywhere;
}
.adm-audit-fact small{
  display:block;
  margin-top:.18rem;
  color:#64748b;
  font-family:'DM Mono',monospace;
  font-size:.72rem;
}
.adm-audit-access-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:.65rem;
}
.adm-audit-access-item{
  display:flex;
  gap:.65rem;
  align-items:flex-start;
  min-width:0;
  padding:.75rem;
  border:1px solid #e2e8f0;
  border-radius:.75rem;
  background:#f8fafc;
}
.adm-audit-access-item i{
  color:#16a34a;
  font-size:1rem;
  margin-top:.1rem;
}
.adm-audit-technical{
  border:1px solid #e2e8f0;
  border-radius:.9rem;
  background:#fff;
  padding:.72rem .82rem;
  width:100%;
  box-shadow:0 1px 2px rgba(15,23,42,.035);
}
.adm-audit-technical summary{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.5rem;
  cursor:pointer;
  color:#334155;
  font-size:.82rem;
  font-weight:850;
  list-style:none;
}
.adm-audit-technical summary::-webkit-details-marker{display:none;}
.adm-audit-technical[open] summary{margin-bottom:.8rem;}
.adm-audit-technical .adm-audit-detail-section{
  gap:.65rem;
}
.adm-audit-meta-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:.55rem;
}
.adm-audit-meta-item{
  min-width:0;
  padding:.55rem .62rem;
  border:1px solid #e2e8f0;
  border-radius:.65rem;
  background:#f8fafc;
}
.adm-audit-meta-item--wide{
  grid-column:1 / -1;
}
.adm-audit-meta-label{
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:#94a3b8;
  font-weight:800;
  margin-bottom:.2rem;
}
.adm-audit-meta-value{
  font-size:.78rem;
  color:#334155;
  overflow-wrap:anywhere;
  line-height:1.4;
}
.adm-audit-note{
  font-size:.84rem;
  color:#475569;
  line-height:1.45;
  overflow-wrap:anywhere;
  padding:.7rem .8rem;
  border:1px solid #e2e8f0;
  border-radius:.65rem;
  background:#f8fafc;
}
@media (max-width: 900px){
  .adm-audit-detail{
    grid-template-columns:1fr;
  }
  .adm-audit-meta-grid,
  .adm-audit-facts,
  .adm-audit-access-grid{
    grid-template-columns:1fr;
  }
  .adm-audit-change{
    grid-template-columns:1fr;
    gap:.35rem;
  }
}
@media (max-width: 700px){
  .adm-audit-filter-form,
  .adm-audit-filter-form .adm-btn-ghost,
  .adm-audit-search{
    width:100%;
  }
  .adm-audit-page-size{
    width:100%;
    justify-content:space-between;
  }
  .adm-audit-page-size select{
    flex:1;
  }
}
</style>

<script>
  window.toggleAuditRow = function(row) {
    const detailId = row.getAttribute("data-detail-target");
    const detailRow = document.getElementById(detailId);
    if (!detailRow) return;

    const willOpen = detailRow.hidden;
    detailRow.hidden = !willOpen;
    row.classList.toggle("is-open", willOpen);
    row.setAttribute("aria-expanded", willOpen ? "true" : "false");
  };

  window.handleAuditRowKeydown = function(event, row) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      window.toggleAuditRow(row);
    }
  };
</script>
{% endblock %}
