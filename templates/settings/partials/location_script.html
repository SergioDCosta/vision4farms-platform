<script>
(function () {
  const button = document.getElementById("autoLocationBtn");
  if (!button) return;

  const statusEl = document.getElementById("autoLocationStatus");
  const latitudeInput = document.getElementById("id_latitude");
  const longitudeInput = document.getElementById("id_longitude");
  const postalCodeInput = document.getElementById("id_postal_code");
  const cityInput = document.getElementById("id_city");
  const districtInput = document.getElementById("id_district");
  const addressLineInput = document.getElementById("id_address_line");

  function setStatus(level, message) {
    if (!statusEl) return;
    statusEl.className = "stg-geo-status";
    if (level === "success") statusEl.classList.add("stg-geo-status--success");
    if (level === "error") statusEl.classList.add("stg-geo-status--error");
    if (level === "info") statusEl.classList.add("stg-geo-status--info");
    statusEl.textContent = message;
  }

  function normalizePostalCode(value) {
    const raw = (value || "").trim();
    if (!raw) return "";
    const digits = raw.replace(/\D/g, "");
    if (digits.length === 7) return `${digits.slice(0, 4)}-${digits.slice(4)}`;
    return raw.toUpperCase();
  }

  function geolocationPromise(options) {
    return new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, options);
    });
  }

  async function requestAutomaticLocation() {
    if (!navigator.geolocation) {
      setStatus("error", "Este navegador não suporta geolocalização.");
      return;
    }

    button.disabled = true;
    setStatus("info", "A obter localização do dispositivo...");

    try {
      const position = await geolocationPromise({
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      });

      const lat = Number(position.coords.latitude || 0);
      const lon = Number(position.coords.longitude || 0);

      if (latitudeInput) latitudeInput.value = lat.toFixed(6);
      if (longitudeInput) longitudeInput.value = lon.toFixed(6);

      setStatus("info", "A converter coordenadas em morada...");

      const endpoint = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&addressdetails=1&accept-language=pt-PT`;
      const response = await fetch(endpoint, { method: "GET" });
      if (!response.ok) throw new Error("Falha ao obter os dados de morada.");

      const payload = await response.json();
      const address = payload.address || {};
      const postcode = normalizePostalCode(address.postcode);
      const city = address.city || address.town || address.village || address.municipality || "";
      const district = address.county || address.state_district || address.state || "";
      const road = address.road || "";
      const houseNumber = address.house_number || "";
      const addressLine = [road, houseNumber].filter(Boolean).join(", ");

      if (postalCodeInput && postcode) postalCodeInput.value = postcode;
      if (cityInput && city) cityInput.value = city;
      if (districtInput && district) districtInput.value = district;
      if (addressLineInput && !addressLineInput.value.trim() && addressLine) {
        addressLineInput.value = addressLine;
      }

      setStatus("success", "Localização preenchida. Confirma os dados e guarda a localização.");
    } catch (error) {
      if (error && typeof error.code === "number") {
        if (error.code === 1) setStatus("error", "Permissão de localização recusada.");
        else if (error.code === 2) setStatus("error", "Não foi possível determinar a localização atual.");
        else if (error.code === 3) setStatus("error", "Tempo limite excedido ao obter a localização.");
        else setStatus("error", "Erro ao obter localização automática.");
      } else {
        setStatus("error", "Não foi possível converter a localização em morada.");
      }
    } finally {
      button.disabled = false;
    }
  }

  button.addEventListener("click", requestAutomaticLocation);

  function shouldAutoRequestLocation() {
    const params = new URLSearchParams(window.location.search || "");
    return params.get("auto_location") === "1" && window.location.hash === "#localizacao";
  }

  if (shouldAutoRequestLocation()) {
    window.setTimeout(() => {
      const locationSection = document.getElementById("localizacao");
      if (locationSection) {
        locationSection.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      const cleanUrl = `${window.location.pathname}${window.location.hash || "#localizacao"}`;
      window.history.replaceState({}, document.title, cleanUrl);
      requestAutomaticLocation();
    }, 350);
  }
})();
</script>
